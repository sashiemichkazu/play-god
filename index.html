<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAY GOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{--verm:#CF4520;--cream:#F7F4EF;--black:#111110;--mid:#888480;--line:#DDD9D3}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--black);font-family:'Courier Prime',Georgia,serif;overflow-x:hidden}
img{display:block;max-width:100%}a{text-decoration:none;color:inherit}
.page{display:none}.page.active{display:block}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0.4rem 3rem;background:rgba(247,244,239,0.7);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-brand{font-weight:700;font-size:0.95rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-size:0.82rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--mid);transition:color .2s;cursor:pointer}
.nav-links a:hover{color:var(--black)}
.hero{min-height:auto;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem 1rem;text-align:center;border-bottom:1px solid var(--line)}
.po-outer,.po-mid,.po-btn{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.po-outer{display:inline-block;padding:1.5px}.po-mid{display:block;padding:3px}
.po-btn{display:block;font-family:'Courier Prime',serif;font-size:1rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;border:none;cursor:pointer;padding:0.6rem 1.8rem;transition:box-shadow .15s,color .15s,opacity .15s}
.po-frame-black{background:var(--black)}.po-frame-verm{background:var(--verm)}.po-frame-cream{background:#b8b2a8}
.po-gap-cream{background:var(--cream)}.po-gap-black{background:var(--black)}
.po-dark{background:var(--black);color:#b0aca8;box-shadow:inset 0 2px 6px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.05)}
.po-dark:hover{color:#fff;box-shadow:inset 0 3px 8px rgba(0,0,0,0.9)}
.po-red{background:var(--verm);color:rgba(255,255,255,0.82);box-shadow:inset 0 2px 5px rgba(0,0,0,0.28)}
.po-red:hover{color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:55vh;border-bottom:1px solid var(--line)}
.split-img{position:relative;overflow:hidden}
.split-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.split-img:hover img{transform:scale(1.03)}
.split-body{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4rem 5rem}
.section-logo{width:min(200px,40vw);margin-top:-14%;margin-bottom:2rem;align-self:center;display:block}
#hotdog .split-img{order:1;border-left:1px solid var(--line)}
.cta{background:var(--black);color:#fff;padding:8rem 3rem;text-align:center;border-bottom:1px solid #333}
footer{background:var(--black);color:var(--mid);padding:2.5rem 3rem;display:flex;justify-content:space-between;align-items:center;font-size:1.24rem;letter-spacing:0.12em;text-transform:uppercase}
.footer-brand{color:#fff;font-weight:700}
.pg-section{background:var(--cream);padding:3px}
.pg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:1200px;margin:0 auto}
.pg-item{aspect-ratio:3/4;overflow:hidden}
.pg-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.6s ease}
.pg-item:hover img{transform:scale(1.05)}
@media(max-width:768px){nav{padding:1rem 1.5rem}.split{grid-template-columns:1fr}.split-img{min-height:55vw;order:0!important}#hotdog .split-img{border-left:none;border-top:1px solid var(--line)}.split-body{padding:3rem 2rem}footer{flex-direction:column;gap:1rem;text-align:center}}
@media(max-width:600px){.pg-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav>
  <span class="nav-brand" onclick="showPage('home')" style="cursor:pointer"><img src="images/img1.png" alt="PLAY GOD" style="height:4.8rem;display:block"></span>
  <ul class="nav-links">
    <li><a onclick="showPage('apparel')">Apparel</a></li>
    <li><a onclick="showPage('hotdog')">Hot Dog</a></li>
  </ul>
</nav>

<div id="page-home" class="page active">
  <section class="split" id="apparel-split">
    <div class="split-img"><img src="images/img2.jpg" alt="PLAY GOD Apparel"></div>
    <div class="split-body">
      <img class="section-logo" src="images/img3.png" alt="PLAY GOD">
      <div class="split-cta">
        <span class="po-outer po-frame-black" onclick="showPage('apparel')" style="cursor:pointer">
          <span class="po-mid po-gap-cream"><button class="po-btn po-dark">View Apparel</button></span>
        </span>
      </div>
    </div>
  </section>
  <section class="split" id="hotdog">
    <div class="split-body">
      <div style="background:var(--cream);display:inline-block;padding:1.5rem 2rem;"><img class="section-logo" src="images/img3.png" alt="PLAY GOD HOTDOG"></div>
      <div class="split-cta">
        <span class="po-outer po-frame-verm" onclick="showPage('hotdog')" style="cursor:pointer">
          <span class="po-mid po-gap-cream"><button class="po-btn po-red">View Hot Dog</button></span>
        </span>
      </div>
    </div>
    <div class="split-img"><img src="images/img4.jpg" alt="PLAY GOD HOTDOG"></div>
  </section>
  <section class="cta">
    <img src="images/img3.png" alt="PLAY GOD" style="width:min(180px,36vw);display:block;margin:0 auto">
  </section>
</div>

<div id="page-apparel" class="page">
  <section style="min-height:60vh;position:relative;display:flex;align-items:flex-end;padding:6rem 4rem 4rem;border-bottom:1px solid var(--line);overflow:hidden;background:var(--cream);">
    <img src="images/img5.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">
  </section>
  <section class="pg-section">
    <div class="pg-grid">
      <div class="pg-item"><img src="images/img2.jpg" alt=""></div>
      <div class="pg-item"><img src="images/img5.jpg" alt=""></div>
      <div class="pg-item"><img src="images/img2.jpg" alt=""></div>
    </div>
  </section>
</div>

<div id="page-hotdog" class="page">
  <section style="position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--black);">
    <img src="images/img4.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.85;">
    <div style="position:relative;z-index:2;text-align:center;padding:2rem;">
      <img src="images/img3.png" alt="PLAY GOD HOTDOG" style="width:min(300px,58vw);display:block;margin:0 auto;mix-blend-mode:multiply;filter:drop-shadow(0 0 30px rgba(247,244,239,0.5));">
    </div>
  </section>
  <section style="background:var(--black);padding:8rem 6rem;border-top:1px solid #333;">
    <div style="max-width:900px;display:flex;flex-direction:column;gap:6rem;">
      <div style="border-bottom:1px solid #333;padding-bottom:6rem;">
        <p style="font-size:clamp(2.4rem,4vw,3.6rem);font-weight:700;color:var(--cream);line-height:1.2;margin:0 0 2rem 0;">伝統的なホットドッグを<br>シンプルに、正直に。</p>
      </div>
      <div style="border-bottom:1px solid #333;padding-bottom:6rem;">
        <p style="font-size:clamp(2.4rem,4vw,3.6rem);font-weight:700;color:var(--cream);line-height:1.2;margin:0 0 2rem 0;">住所不定。神出鬼没。</p>
        <img src="images/img4.jpg" alt="" style="width:100%;height:auto;object-fit:cover;margin-top:1.6rem;display:block;">
      </div>
      <div>
        <p style="font-size:clamp(2.4rem,4vw,3.6rem);font-weight:700;color:var(--cream);line-height:1.2;margin:0 0 2rem 0;">リーズナブルに、<br>本物の一本を。</p>
        <img src="images/img4.jpg" alt="" style="width:100%;height:auto;object-fit:cover;margin-top:1.6rem;display:block;">
      </div>
    </div>
  </section>
  <section style="height:55vh;overflow:hidden;">
    <img src="images/img4.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;">
  </section>
  <section style="padding:10rem 4rem;background:var(--black);text-align:center;border-top:1px solid #333;">
    <p style="font-size:clamp(2.4rem,5vw,4.4rem);font-weight:700;color:var(--cream);letter-spacing:-0.01em;margin:0 0 3rem 0;">出没情報は<br>インスタグラムで。</p>
    <a href="https://instagram.com/playgod_hotdog" target="_blank" style="display:inline-block;padding:1.4rem 4rem;border:2px solid var(--verm);color:var(--verm);font-size:1.6rem;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;font-weight:700;font-family:'Courier Prime',monospace;">@playgod_hotdog</a>
  </section>
</div>

<script>
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  window.scrollTo(0,0);
}
</script>
<footer>
  <span>© <span class="copy-year"></span> PLAY GOD — Tokyo</span>
</footer>
<script>document.querySelectorAll(".copy-year").forEach(el=>el.textContent=new Date().getFullYear());</script>
</body>
</html>
